license="${mod_license}"
issueTrackerURL="https://github.com/MasterGeneral156/CTD-Mythos/issues" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
updateJSONURL="https://raw.githubusercontent.com/MasterGeneral156/Version/master/CTD-Mythos.json" #optional
displayURL="https://www.curseforge.com/minecraft/mc-mods/ctd-mythos" #optional
#logoFile="ctd-mythos.png" #optional
authors="${mod_authors}" #optional
#displayTest="MATCH_VERSION" # MATCH_VERSION is the default if nothing is specified (#optional)
description='''${mod_description}'''
[[dependencies.${mod_id}]]
    modId="ctdcore"
    mandatory=true
    versionRange="[${ctd_core_ver},]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"
